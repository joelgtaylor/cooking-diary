<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Commander Keen-ish: The Sourdough Menace</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e2a;height:100%;overflow:hidden;
    font-family:"Courier New",monospace;-webkit-user-select:none;user-select:none;
    touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;background:#0b0e2a;max-width:100vw;max-height:100vh}
  #touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;
    padding:0 12px 14px;pointer-events:none;z-index:5}
  body.touchmode #touch{display:flex}
  .tbtn{pointer-events:auto;width:72px;height:72px;border-radius:50%;
    background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);
    color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
    font-family:inherit}
  .tbtn:active{background:rgba(255,255,255,.32)}
  .tgrp{display:flex;gap:10px}
  #hint{position:fixed;top:8px;left:0;right:0;text-align:center;color:#8f9bb8;
    font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="hint"></div>
<div id="touch">
  <div class="tgrp">
    <div class="tbtn" id="tL">&#9664;</div>
    <div class="tbtn" id="tR">&#9654;</div>
  </div>
  <div class="tgrp">
    <div class="tbtn" id="tP">X</div>
    <div class="tbtn" id="tB">B</div>
    <div class="tbtn" id="tA">A</div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   COMMANDER KEEN-ISH: THE SOURDOUGH MENACE
   A tiny love letter to id Software's 1990 classic, baked into
   a cooking diary. Dr. Starter has stolen your sourdough
   starter culture! Pogo, shoot and platform your way home.
   ============================================================ */
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

const TILE = 30, COLS = 32, ROWS = 18, W = 960, H = 540;
const GRAV = 0.55, MOVE = 3.4, JUMP_V = 11.6, POGO_V = 15.6;

/* ---------------- levels (32x18 ASCII maps) ---------------- */
const LEVELS = [
{ name: "LEVEL 1: THE CRUMBLY FLATS",
  hints: [ {tx:3,ty:11.6,text:"ARROWS/A,D MOVE - SPACE JUMP"}, {tx:15,ty:11.6,text:"C SHOOTS - X = POGO STICK"} ],
  map: [
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "........CC......CC..............",
  ".......====....====.............",
  "..........................C.....",
  ".........................===....",
  "..P....C...Y....C...Y...C....E..",
  "############..########..########",
  "############..########..########",
  "############..########..########",
  "############..########..########"] },
{ name: "LEVEL 2: THE YEASTY HEIGHTS",
  hints: [ {tx:3,ty:11.6,text:"MIND THE GAPS"}, {tx:15.5,ty:11.6,text:"SPIKES ARE RUDE"} ],
  map: [
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "................................",
  "..........CC....................",
  ".........====...................",
  "....................CC..........",
  "...................====.........",
  ".....===....................==..",
  "......C.........................",
  "..P.....C....G......^^.....C..E.",
  "######....#########....#########",
  "######....#########....#########",
  "######....#########....#########",
  "######....#########....#########"] }
];

/* ---------------- audio (tiny bleeps) ---------------- */
let AC = null, muted = false;
function beep(f, d, type, vol){
  if (muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.value = f;
    g.gain.setValueAtTime(vol||0.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  }catch(e){}
}
const sfx = {
  jump(){ beep(300,0.12,'square',0.05); },
  pogo(){ beep(180,0.15,'sawtooth',0.06); },
  shoot(){ beep(880,0.08,'square',0.05); },
  coin(){ beep(1320,0.09,'square',0.05); setTimeout(()=>beep(1760,0.12,'square',0.05),70); },
  kill(){ beep(220,0.18,'sawtooth',0.07); },
  hurt(){ beep(140,0.3,'sawtooth',0.09); },
  exit(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'square',0.06),i*110)); },
  win(){ [523,659,784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'square',0.07),i*130)); }
};

/* ---------------- input ---------------- */
const keys = {};
const touch = { left:false, right:false, jump:false, shoot:false };
addEventListener('keydown', e=>{
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase()==='m') muted = !muted;
  if (e.key==='Enter') onConfirm();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
function press(id, name){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); touch[name]=true; if(name==='jump') onConfirm(); };
  const off = e=>{ e.preventDefault(); touch[name]=false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off); el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
}
press('tL','left'); press('tR','right'); press('tA','jump'); press('tB','shoot');
document.getElementById('tP').addEventListener('touchstart', e=>{e.preventDefault(); togglePogo();},{passive:false});
document.getElementById('tP').addEventListener('mousedown', e=>{e.preventDefault(); togglePogo();});
if ('ontouchstart' in window || navigator.maxTouchPoints>0 || (window.matchMedia && matchMedia('(pointer:coarse)').matches)) document.body.classList.add('touchmode');
cv.addEventListener('touchstart', e=>{ e.preventDefault(); onConfirm(); }, {passive:false});
cv.addEventListener('mousedown', ()=>onConfirm());

function input(){
  return {
    left:  keys['arrowleft']||keys['a']||touch.left,
    right: keys['arrowright']||keys['d']||touch.right,
    jump:  keys[' ']||keys['arrowup']||keys['w']||keys['z']||touch.jump,
    shoot: keys['c']||keys['x']&&false||touch.shoot,
    pogo:  keys['x'],
    enter: keys['enter']
  };
}

/* ---------------- game state ---------------- */
let state = 'title';       // title | play | clear | win | over
let level = 0, score = 0, lives = 3;
let solids = [], plats = [], spikes = [];
let spawn = {x:0,y:0};
let exit = {x:0,y:0};
let cookies = [], yorps = [], gargs = [], shots = [];
let clearTimer = 0, invuln = 0, shake = 0;
let parts=[], floaters=[];
function spawnPart(x,y,vx,vy,life,col,size,grav){ parts.push({x,y,vx,vy,life,max:life,col,size,grav:grav||0}); }
function burst(x,y,n,col,spd,life,size){
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=spd*(0.4+Math.random()*0.8);
    spawnPart(x,y,Math.cos(a)*s,Math.sin(a)*s-1.2,life*(0.6+Math.random()*0.8),col,size*(0.7+Math.random()*0.7),0.14); }
}
function floater(x,y,text,col){ floaters.push({x,y,text,col:col||'#ffd75e',t:55}); }
function updateParts(){
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav; p.vx*=0.98; p.life--; }
  parts=parts.filter(p=>p.life>0);
  for(const f of floaters){ f.y-=0.7; f.t--; }
  floaters=floaters.filter(f=>f.t>0);
}
function drawParts(){
  for(const p of parts){ cx.globalAlpha=Math.max(0,p.life/p.max); cx.fillStyle=p.col; const s=p.size; cx.fillRect(p.x-s/2,p.y-s/2,s,s); }
  cx.globalAlpha=1;
  cx.font='bold 13px "Courier New",monospace'; cx.textAlign='center';
  for(const f of floaters){ cx.globalAlpha=Math.min(1,f.t/25); cx.fillStyle=f.col; cx.fillText(f.text,f.x,f.y); }
  cx.globalAlpha=1; cx.textAlign='left';
}
let stars = [];
for (let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.4,tw:Math.random()*6.28});

const P = { x:0,y:0,w:22,h:30, vx:0,vy:0, face:1, onGround:false, pogo:false,
            coyote:0, jbuf:0, shootCd:0, anim:0, squash:0 };

function tileAt(c,r){
  if (c<0||c>=COLS||r<0||r>=ROWS) return '#';
  return LEVELS[level].map[r][c];
}
function solidAt(c,r){ const t=tileAt(c,r); return t==='#'; }

function loadLevel(n){
  level = n;
  solids=[]; plats=[]; spikes=[]; cookies=[]; yorps=[]; gargs=[]; shots=[];
  const m = LEVELS[n].map;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const t = m[r][c], x=c*TILE, y=r*TILE;
    if (t==='#') solids.push({x,y});
    else if (t==='=') plats.push({x,y});
    else if (t==='^') spikes.push({x:x+4,y:y+12,w:22,h:18});
    else if (t==='P') spawn={x:x+4,y:y};
    else if (t==='E') exit={x:x,y:y-6};
    else if (t==='C') cookies.push({x:x+7,y:y+7,taken:false,ph:Math.random()*6.28});
    else if (t==='Y') yorps.push(mkYorp(x,y));
    else if (t==='G') gargs.push(mkGarg(x,y));
  }
  resetPlayer();
}
function mkYorp(x,y){ return {x:x+2,y:y+8,w:26,h:22,vx:0.9,vy:0,dir:1,alive:true,ph:Math.random()*6.28}; }
function mkGarg(x,y){ return {x:x+1,y:y-4,w:28,h:34,vx:0,vy:0,dir:-1,alive:true,charge:false,ph:0}; }

function resetPlayer(){
  P.x=spawn.x; P.y=spawn.y; P.vx=0; P.vy=0; P.pogo=false; P.face=1;
  P.coyote=0; P.jbuf=0; P.shootCd=0; P.squash=0; invuln=120;
}
function startGame(){ score=0; lives=3; loadLevel(0); state='play'; }
function onConfirm(){
  if (state==='title') startGame();
  else if (state==='over' || state==='win') startGame();
}
function togglePogo(){
  if (state!=='play') return;
  P.pogo=!P.pogo; sfx.pogo();
  document.getElementById('hint').textContent = P.pogo ? "POGO ON - boing!" : "";
  setTimeout(()=>{document.getElementById('hint').textContent="";},1200);
}
let pogoKeyWas=false;

/* ---------------- physics helpers ---------------- */
function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function moveBody(b, isPlayer){
  // X axis
  b.x += b.vx;
  let box = {x:b.x, y:b.y, w:b.w, h:b.h};
  const c0=Math.floor(box.x/TILE), c1=Math.floor((box.x+box.w-1)/TILE);
  const r0=Math.floor(box.y/TILE), r1=Math.floor((box.y+box.h-1)/TILE);
  for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++){
    if (solidAt(c,r)){
      if (b.vx>0) b.x = c*TILE - b.w; else if (b.vx<0) b.x = (c+1)*TILE;
      box.x=b.x; b.vx=0;
    }
  }
  // Y axis
  const prevBottom = b.y + b.h;
  b.y += b.vy;
  b.onGround = false;
  box = {x:b.x, y:b.y, w:b.w, h:b.h};
  const d0=Math.floor(box.x/TILE), d1=Math.floor((box.x+box.w-1)/TILE);
  const e0=Math.floor(box.y/TILE), e1=Math.floor((box.y+box.h-1)/TILE);
  for (let r=e0;r<=e1;r++) for (let c=d0;c<=d1;c++){
    if (solidAt(c,r)){
      if (b.vy>0){ b.y = r*TILE - b.h; b.vy=0; b.onGround=true; }
      else if (b.vy<0){ b.y = (r+1)*TILE; b.vy=0; }
      box.y=b.y;
    }
  }
  // one-way platforms (only when falling and previously above)
  if (b.vy>=0){
    for (const p of plats){
      if (b.x+b.w>p.x+2 && b.x<p.x+TILE-2){
        const top=p.y;
        if (prevBottom<=top+1 && b.y+b.h>=top && b.y+b.h<=top+14){
          b.y=top-b.h; b.vy=0; b.onGround=true;
        }
      }
    }
  }
  return b.onGround;
}

/* ---------------- update ---------------- */
function die(){
  if (invuln>0) return;
  sfx.hurt(); shake=14; lives--;
  if (lives<=0){ state='over'; }
  else { loadLevel(level); } // reload resets enemies; keeps score
}

function update(){
  const inp = input();
  if (state!=='play') return;
  if (invuln>0) invuln--;
  if (shake>0) shake--;

  // pogo toggle (edge)
  if (inp.pogo && !pogoKeyWas) togglePogo();
  pogoKeyWas = inp.pogo;

  // horizontal
  P.anim++;
  if (inp.left){ P.vx=-MOVE; P.face=-1; }
  else if (inp.right){ P.vx=MOVE; P.face=1; }
  else P.vx*=0.7;
  if (Math.abs(P.vx)<0.1) P.vx=0;

  // jumping w/ coyote + buffer
  if (P.onGround) P.coyote=7; else if (P.coyote>0) P.coyote--;
  if (inp.jump) P.jbuf=6; else if (P.jbuf>0) P.jbuf--;
  if (P.jbuf>0 && P.coyote>0){
    P.vy = P.pogo ? -POGO_V : -JUMP_V;
    P.jbuf=0; P.coyote=0; P.onGround=false;
    P.pogo ? sfx.pogo() : sfx.jump();
  }
  P.vy += GRAV; if (P.vy>14) P.vy=14;
  // variable jump height
  if (!inp.jump && P.vy<-5) P.vy=-5;
  const wasGround=P.onGround, fallV=P.vy;
  moveBody(P,true);
  if (P.squash>0) P.squash--;
  if (!wasGround && P.onGround){
    if (fallV>7){ burst(P.x+P.w/2,P.y+P.h,10,'#b9a88f',2.2,28,4); P.squash=9; }
    else if (fallV>2){ burst(P.x+P.w/2,P.y+P.h,4,'#b9a88f',1.4,18,3); }
  }

  // pogo auto-bounce
  if (P.pogo && P.onGround && inp.jump){ P.vy=-POGO_V; P.onGround=false; sfx.pogo(); burst(P.x+P.w/2,P.y+P.h+8,6,'#cfc3ad',1.8,20,3); }

  // fell out of world
  if (P.y>H+60){ lives--; if(lives<=0) state='over'; else loadLevel(level); return; }

  // shooting
  if (P.shootCd>0) P.shootCd--;
  if (inp.shoot && P.shootCd<=0){
    shots.push({x:P.x+P.w/2 + P.face*14, y:P.y+12, w:10,h:4, vx:P.face*7.5, life:90});
    P.shootCd=16; sfx.shoot();
    burst(P.x+P.w/2+P.face*16, P.y+14, 3, '#ffe95e', 1.2, 10, 3);
  }

  // shots
  for (const s of shots){
    s.x+=s.vx; s.life--;
    if (s.x<0||s.x>W) s.life=0;
    const c=Math.floor(s.x/TILE), r=Math.floor(s.y/TILE);
    if (solidAt(c,r)) s.life=0;
  }
  shots = shots.filter(s=>s.life>0);

  // yorps
  for (const y of yorps){
    if (!y.alive) continue;
    y.ph+=0.1;
    y.vx = y.dir*0.9;
    const wasGround = y.onGround;
    moveBody(y,false);
    y.vy += GRAV; if (y.vy>12) y.vy=12;
    // turn at walls or ledges
    const aheadX = y.dir>0 ? y.x+y.w+2 : y.x-2;
    const ac=Math.floor(aheadX/TILE), ar=Math.floor((y.y+y.h+4)/TILE);
    if (y.vx===0 || !solidAt(ac,ar)) y.dir*=-1;
    // shot?
    for (const s of shots){
      if (s.life>0 && rectsOverlap(s,y)){ y.alive=false; s.life=0; score+=200; sfx.kill(); burst(y.x+y.w/2,y.y+y.h/2,14,'#3fae4a',2.6,34,5); floater(y.x+y.w/2,y.y-4,'+200'); }
    }
    // touch player?
    if (rectsOverlap(P,y)) die();
  }
  if (state!=='play') return;

  // gargs (chargers)
  for (const g of gargs){
    if (!g.alive) continue;
    g.ph+=0.12;
    const dx=(P.x+P.w/2)-(g.x+g.w/2), dy=(P.y+P.h/2)-(g.y+g.h/2);
    if (!g.charge && Math.abs(dx)<230 && Math.abs(dy)<70) g.charge=true;
    if (g.charge){ g.dir = dx>0?1:-1; g.vx = g.dir*2.5; }
    else g.vx*=0.8;
    moveBody(g,false);
    g.vy+=GRAV; if(g.vy>12) g.vy=12;
    if (g.vx===0 && g.charge) g.dir*=-1;
    for (const s of shots){
      if (s.life>0 && rectsOverlap(s,g)){ g.alive=false; s.life=0; score+=300; sfx.kill(); burst(g.x+g.w/2,g.y+g.h/2,16,'#c0392b',2.8,36,5); floater(g.x+g.w/2,g.y-4,'+300'); }
    }
    if (rectsOverlap(P,g)) die();
  }
  if (state!=='play') return;

  // spikes
  const pb={x:P.x+3,y:P.y+4,w:P.w-6,h:P.h-4};
  for (const s of spikes) if (rectsOverlap(pb,s)) die();
  if (state!=='play') return;

  // cookies
  for (const c of cookies){
    if (c.taken) continue;
    c.ph+=0.08;
    if (rectsOverlap({x:P.x,y:P.y,w:P.w,h:P.h},{x:c.x-4,y:c.y-4,w:26,h:26})){
      c.taken=true; score+=100; sfx.coin();
      burst(c.x+6,c.y+6,10,'#ffd75e',2,26,3); floater(c.x+6,c.y-6,'+100');
    }
  }

  // dutch-oven rocket idling flame
  if (P.anim%4===0) spawnPart(exit.x+15+(Math.random()-0.5)*10, exit.y+TILE+10, (Math.random()-0.5)*0.6, 1+Math.random()*1.2, 16, Math.random()<0.5?'#ff9d2e':'#ff5a2e', 4, 0.06);

  // exit (dutch-oven rocket!)
  if (rectsOverlap({x:P.x,y:P.y,w:P.w,h:P.h},{x:exit.x,y:exit.y,w:TILE,h:TILE+6})){
    score+=1000; sfx.exit(); state='clear'; clearTimer=110;
  }
}

/* ---------------- drawing ---------------- */
function drawTile(x,y){
  cx.fillStyle='#5b4632'; cx.fillRect(x,y,TILE,TILE);
  cx.fillStyle='#6f5740'; cx.fillRect(x,y,TILE,6);
  cx.fillStyle='#4a3826'; cx.fillRect(x,y+TILE-6,TILE,6);
  cx.fillStyle='rgba(0,0,0,.18)'; cx.fillRect(x,y,TILE,2);
}
function drawPlat(x,y){
  cx.fillStyle='#8a6a3f'; cx.fillRect(x,y,TILE,10);
  cx.fillStyle='#a5824f'; cx.fillRect(x,y,TILE,3);
  cx.fillStyle='#5e4527'; cx.fillRect(x,y+7,TILE,3);
}
function drawSpike(s){
  cx.fillStyle='#c8ccd4';
  for(let i=0;i<3;i++){
    const bx=s.x+i*8;
    cx.beginPath(); cx.moveTo(bx,s.y+s.h); cx.lineTo(bx+4,s.y); cx.lineTo(bx+8,s.y+s.h); cx.fill();
  }
  cx.fillStyle='#7d838e'; cx.fillRect(s.x,s.y+s.h-3,s.w,3);
}
function drawCookie(c){
  const bob=Math.sin(c.ph)*3;
  cx.fillStyle='#c98d4b';
  cx.beginPath(); cx.arc(c.x+6,c.y+6+bob,8,0,7); cx.fill();
  cx.fillStyle='#5e3a1c';
  [[-3,-2],[2,-4],[3,3],[-2,4]].forEach(o=>cx.fillRect(c.x+6+o[0]-1,c.y+6+bob+o[1]-1,3,3));
}
function drawYorp(y){
  const w=Math.sin(y.ph)*2;
  cx.fillStyle='#3fae4a';
  cx.beginPath(); cx.ellipse(y.x+y.w/2,y.y+y.h/2+y.w*0.06,y.w/2,y.h/2+w*0.3,0,0,7); cx.fill();
  cx.fillStyle='#2c7d34';
  cx.fillRect(y.x+3,y.y+y.h-6,7,6); cx.fillRect(y.x+y.w-10,y.y+y.h-6,7,6);
  cx.fillStyle='#fff';
  const ex=y.x+y.w/2 + y.dir*5;
  cx.fillRect(ex-7,y.y+5,7,9); cx.fillRect(ex+1,y.y+5,7,9);
  cx.fillStyle='#111';
  cx.fillRect(ex-5,y.y+8,3,4); cx.fillRect(ex+3,y.y+8,3,4);
}
function drawGarg(g){
  const j=g.charge?Math.sin(g.ph)*3:0;
  cx.fillStyle='#c0392b';
  cx.beginPath(); cx.ellipse(g.x+g.w/2,g.y+g.h/2,g.w/2,g.h/2,0,0,7); cx.fill();
  cx.fillStyle='#922b21';
  cx.fillRect(g.x+4,g.y+g.h-7,8,7); cx.fillRect(g.x+g.w-12,g.y+g.h-7,8,7);
  cx.fillStyle='#fff';
  const ex=g.x+g.w/2+g.dir*4;
  cx.fillRect(ex-9,g.y+8,8,7); cx.fillRect(ex+2,g.y+8,8,7);
  cx.fillStyle='#a00';
  cx.fillRect(ex-7,g.y+10,4,3); cx.fillRect(ex+4,g.y+10,4,3);
  // angry brows
  cx.fillStyle='#5e130d';
  cx.fillRect(ex-9,g.y+5,8,3); cx.fillRect(ex+2,g.y+5,8,3);
  if (g.charge){ cx.fillStyle='rgba(255,80,40,.5)'; cx.fillRect(g.x-4+j,g.y,4,g.h); }
}
function drawPlayer(){
  if (invuln>0 && Math.floor(invuln/4)%2===0 && state==='play') return; // blink
  const x=Math.round(P.x), y=Math.round(P.y);
  const bob = P.onGround && Math.abs(P.vx)>0.5 ? Math.sin(P.anim*0.5)*2 : 0;
  // squash & stretch
  let sx=1, sy=1;
  if (P.squash>0){ const k=P.squash/9; sx=1+0.26*k; sy=1-0.26*k; }
  else if (!P.onGround){ if (P.vy<-4){ sx=0.9; sy=1.1; } else if (P.vy>5){ sx=1.08; sy=0.92; } }
  cx.save();
  cx.translate(x+P.w/2, y+P.h);
  cx.scale(sx,sy);
  cx.translate(-(x+P.w/2), -(y+P.h));
  // pogo stick
  if (P.pogo){
    cx.fillStyle='#888';
    cx.fillRect(x+P.w/2-2, y+P.h, 4, 12);
    cx.fillStyle='#c33';
    cx.fillRect(x+P.w/2-5, y+P.h+10, 10, 4);
    cx.fillStyle='#aaa';
    for(let i=0;i<3;i++) cx.fillRect(x+P.w/2-3, y+P.h+2+i*3, 6, 1);
  }
  // legs (run cycle)
  cx.fillStyle='#2b3a67';
  const run = P.onGround && Math.abs(P.vx)>0.5;
  const sw = run ? Math.sin(P.anim*0.55)*4 : 0;
  cx.fillRect(x+4+sw*0.5, y+22+bob-Math.max(0,sw*0.35), 6, 8);
  cx.fillRect(x+12-sw*0.5, y+22+bob-Math.max(0,-sw*0.35), 6, 8);
  // body (blue shirt)
  cx.fillStyle='#2f6fd0';
  cx.fillRect(x+3, y+10+bob, P.w-6, 13);
  cx.fillStyle='#255aab'; cx.fillRect(x+3, y+19+bob, P.w-6, 4);
  // head
  cx.fillStyle='#f2c89b';
  cx.fillRect(x+4, y+bob, P.w-8, 11);
  // helmet (red with stripe)
  cx.fillStyle='#d23b3b';
  cx.fillRect(x+2, y-4+bob, P.w-4, 8);
  cx.fillStyle='#a02a2a'; cx.fillRect(x+2, y+1+bob, P.w-4, 3);
  cx.fillStyle='#fff'; cx.fillRect(x+P.w/2-2, y-4+bob, 4, 8);
  // visor/eye
  cx.fillStyle='#123';
  const ex = x + P.w/2 + P.face*4;
  cx.fillRect(ex-3, y+4+bob, 6, 3);
  // raygun
  cx.fillStyle='#666';
  cx.fillRect(x + (P.face>0?P.w-2:-8), y+14+bob, 10, 4);
  cx.fillStyle='#ff5'; cx.fillRect(x + (P.face>0?P.w+4:-10), y+14+bob, 4, 4);
  cx.restore();
}
function drawExit(){
  const x=exit.x, y=exit.y;
  // flame
  const fl = 6+Math.sin(Date.now()*0.02)*4;
  cx.fillStyle='#ff9d2e';
  cx.beginPath(); cx.moveTo(x+6,y+TILE+6); cx.lineTo(x+15,y+TILE+6+fl+8); cx.lineTo(x+24,y+TILE+6); cx.fill();
  cx.fillStyle='#ff5a2e';
  cx.beginPath(); cx.moveTo(x+10,y+TILE+6); cx.lineTo(x+15,y+TILE+6+fl); cx.lineTo(x+20,y+TILE+6); cx.fill();
  // dutch oven body
  cx.fillStyle='#3a3f4a';
  cx.beginPath(); cx.ellipse(x+15,y+TILE-2,14,8,0,0,7); cx.fill();
  cx.fillRect(x+1,y+8,28,20);
  cx.fillStyle='#565d6b'; cx.fillRect(x+1,y+8,28,5);
  // lid + knob
  cx.fillStyle='#2c3038';
  cx.beginPath(); cx.ellipse(x+15,y+8,15,6,0,0,7); cx.fill();
  cx.fillStyle='#777'; cx.fillRect(x+13,y+1,4,5);
  // porthole
  cx.fillStyle='#9fd8ff'; cx.fillRect(x+10,y+15,10,8);
  cx.fillStyle='#3a3f4a'; cx.fillRect(x+10,y+15,10,2);
}
function drawHUD(){
  cx.fillStyle='#fff'; cx.font='bold 15px "Courier New",monospace'; cx.textAlign='left';
  cx.fillText('SCORE '+score, 12, 22);
  cx.fillText('x '+lives, 200, 22);
  // keen-head life icon
  cx.fillStyle='#f2c89b'; cx.fillRect(178,10,12,10);
  cx.fillStyle='#d23b3b'; cx.fillRect(177,6,14,6);
  cx.textAlign='center';
  cx.fillStyle='#ffd75e';
  cx.fillText(LEVELS[level].name, W/2, 22);
  cx.textAlign='left';
  if (muted){ cx.fillStyle='#8f9bb8'; cx.fillText('[MUTED]', W-90, 22); }
}
function centerText(txt, y, size, color){
  cx.font='bold '+size+'px "Courier New",monospace';
  cx.textAlign='center'; cx.fillStyle=color||'#fff';
  cx.fillText(txt, W/2, y); cx.textAlign='left';
}
function draw(){
  cx.save();
  if (shake>0) cx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // bg
  const gr=cx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#0b0e2a'); gr.addColorStop(1,'#1b1440');
  cx.fillStyle=gr; cx.fillRect(-20,-20,W+40,H+40);
  cx.fillStyle='#fff';
  for (const s of stars){
    const a=0.4+0.6*Math.abs(Math.sin(Date.now()*0.001+s.tw));
    cx.globalAlpha=a*0.8; cx.fillRect(s.x,s.y,s.s,s.s);
  }
  cx.globalAlpha=1;

  if (state==='title'){
    centerText('COMMANDER KEEN-ISH', 120, 44, '#ffd75e');
    centerText('in: THE SOURDOUGH MENACE', 165, 24, '#9fd8ff');
    cx.font='15px "Courier New",monospace'; cx.textAlign='center'; cx.fillStyle='#cdd6f4';
    const story=[
      'Dr. Starter has stolen your family\'s',
      '100-year-old sourdough starter culture!',
      '',
      'Grab your pogo stick and raygun.',
      'Bounce across the galaxy. Get it back.'
    ];
    story.forEach((l,i)=>cx.fillText(l, W/2, 225+i*24));
    cx.fillStyle='#8f9bb8';
    ['ARROWS / A D .... MOVE','SPACE / Z ...... JUMP','X .............. POGO STICK','C .............. SHOOT RAYGUN','M .............. MUTE'].forEach((l,i)=>cx.fillText(l,W/2,370+i*22));
    if (Math.floor(Date.now()/500)%2===0) centerText('PRESS ENTER TO PLAY', 500, 22, '#ffd75e');
    cx.textAlign='left';
    // mini keen pogo-ing across the bottom
    {
      const bt=Date.now()*0.005;
      const bx=140+((Date.now()*0.07)%(W-280));
      const by=522-Math.abs(Math.sin(bt))*58;
      const sv={x:P.x,y:P.y,pogo:P.pogo,face:P.face,vy:P.vy,vx:P.vx,og:P.onGround,inv:invuln,sq:P.squash,an:P.anim};
      P.x=bx-11; P.y=by; P.pogo=true; P.face=1; P.vy=-Math.cos(bt)*9; P.vx=2; P.onGround=false; invuln=0; P.squash=0; P.anim+=2;
      drawPlayer();
      P.x=sv.x; P.y=sv.y; P.pogo=sv.pogo; P.face=sv.face; P.vy=sv.vy; P.vx=sv.vx; P.onGround=sv.og; invuln=sv.inv; P.squash=sv.sq; P.anim=sv.an;
    }
  } else {
    for (const s of solids) drawTile(s.x,s.y);
    for (const p of plats) drawPlat(p.x,p.y);
    for (const s of spikes) drawSpike(s);
    // hints
    cx.font='bold 13px "Courier New",monospace'; cx.textAlign='center'; cx.fillStyle='rgba(255,255,255,.55)';
    for (const h of LEVELS[level].hints) cx.fillText(h.text, h.tx*TILE, h.ty*TILE);
    cx.textAlign='left';
    for (const c of cookies) if(!c.taken) drawCookie(c);
    drawExit();
    for (const y of yorps) if(y.alive) drawYorp(y);
    for (const g of gargs) if(g.alive) drawGarg(g);
    // shots
    cx.fillStyle='#ffe95e';
    for (const s of shots){ cx.fillRect(s.x,s.y,s.w,s.h); cx.fillStyle='#fff'; cx.fillRect(s.x+s.w-3,s.y,3,s.h); cx.fillStyle='#ffe95e'; }
    drawPlayer();
    drawParts();
    drawHUD();
    if (P.pogo){ cx.fillStyle='#ffd75e'; cx.font='bold 13px "Courier New",monospace'; cx.fillText('POGO!', 12, 42); }
  }

  if (state==='clear'){
    cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(0,0,W,H);
    centerText('LEVEL CLEAR!', H/2-20, 40, '#ffd75e');
    centerText('+1000', H/2+30, 24, '#fff');
  }
  if (state==='over'){
    cx.fillStyle='rgba(0,0,0,.7)'; cx.fillRect(0,0,W,H);
    centerText('GAME OVER', H/2-30, 48, '#ff5a5a');
    centerText('SCORE: '+score, H/2+20, 22, '#fff');
    if (Math.floor(Date.now()/500)%2===0) centerText('PRESS ENTER', H/2+60, 20, '#8f9bb8');
  }
  if (state==='win'){
    cx.fillStyle='rgba(0,0,0,.7)'; cx.fillRect(0,0,W,H);
    centerText('STARTER SECURED!', H/2-60, 44, '#ffd75e');
    cx.font='16px "Courier New",monospace'; cx.textAlign='center'; cx.fillStyle='#cdd6f4';
    cx.fillText('You pogo\'d across the galaxy and got', W/2, H/2);
    cx.fillText('the sourdough starter back. The loaves are saved.', W/2, H/2+26);
    centerText('FINAL SCORE: '+score, H/2+70, 22, '#fff');
    if (Math.floor(Date.now()/500)%2===0) centerText('PRESS ENTER TO PLAY AGAIN', H/2+110, 18, '#8f9bb8');
    cx.textAlign='left';
  }
  cx.restore();
}

/* ---------------- main loop ---------------- */
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(50, t-last); last=t;
  // fixed-ish steps for stable physics
  let steps = dt>20 ? 2 : 1;
  for (let i=0;i<steps;i++){
    if (state==='play') update();
    else if (state==='clear'){ if(--clearTimer<=0){ if(level+1<LEVELS.length){ loadLevel(level+1); state='play'; } else { state='win'; sfx.win(); } } }
  }
  updateParts();
  draw();
}
// validate maps in console (dev aid)
LEVELS.forEach((L,i)=>L.map.forEach((row,r)=>{
  if(row.length!==COLS) console.warn('level '+i+' row '+r+' len '+row.length);
}));
requestAnimationFrame(loop);
</script>
