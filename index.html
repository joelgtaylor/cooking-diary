<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joel's Cooking & Baking Diary</title>
<style>
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; max-width: 720px;
         margin: 0 auto; padding: 20px 16px 48px; color: #222; line-height: 1.55; }
  h1 { font-size: 1.5rem; margin-bottom: 0.2rem; }
  .sub { color: #666; margin-bottom: 1.4rem; }
  h2 { font-size: 1.15rem; margin-top: 1.8rem; border-bottom: 1px solid #e5e5e5; padding-bottom: 4px; }
  ul { padding-left: 1.2rem; }
  figure { margin: 1.2rem 0; }
  img { width: 100%; border-radius: 10px; display: block; }
  figcaption { color: #666; font-size: 0.85rem; margin-top: 6px; text-align: center; }
  .verdict { background: #f6f4ec; border-radius: 10px; padding: 14px 16px; margin-top: 1.6rem; }
  .entry-card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; margin: 1rem 0; }
  .entry-card h2 { margin-top: 0; border: none; }
  .entry-card a { color: inherit; text-decoration: none; }
  .entry-card a:hover h2 { text-decoration: underline; }
  .thumb { width: 100%; border-radius: 8px; margin-top: 10px; }
  nav.back { margin-bottom: 1rem; } nav.back a { color: #666; text-decoration: none; }
</style>
</head>
<body>
<h1>Joel's Cooking &amp; Baking Diary</h1>
<div class="sub">Ratios, method notes, and photos &mdash; one entry per bake.</div>
<div class="entry-card"><a href="2026-10-12-sourdough-kefir-loaves/">
<h2>Sourdough Kefir Loaves</h2>
<div class="sub">Oct 12&ndash;13, 2026 &middot; two loaves, kefir in place of water</div>
<img class="thumb" data-b64="2026-10-12-sourdough-kefir-loaves/photos/11-two-loaves.jpg" alt="Two finished sourdough loaves">
</a></div>
<script>
document.querySelectorAll('img[data-b64]').forEach(img => {
  fetch(img.dataset.b64).then(r => r.text()).then(t => {
    img.src = 'data:image/jpeg;base64,' + t.trim();
  });
});
</script>
</body>
</html>
